<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-end Course</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="course-main">
        <section class="course-section">
            <div class="course-img-div">
                <img class="course-img" src="images/htmlcss.png" alt="htmlcss">
            </div>
            <div class="course-content">
                <h1 class="course-name">HTML & CSS - Course</h1>
                <p class="course-teacher">Teacher : John Doe</p>
                <p class="course-duration"> 6 Weeks & 20 Leassons</p>
                <p class="course-details">HTML & CSS Course For Begginers</p>
            </div>
            <div class="course-btn">
                <p class="course-price"><strong>125$</strong></p>
                <a class="view-btn" href="">View Course</a>
            </div>
        </section>
    </main>
</body>
</html>
